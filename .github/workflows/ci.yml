# Checks the repository on every push to main and on every pull request.
name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The checks every repository of the suite runs, held once in EH3D-DOCS as a reusable workflow; the reference is a full
  # commit, so a change there reaches this repository only when this line is moved.
  validate:
    uses: JuanenRac/EH3D-DOCS/.github/workflows/validate.yml@4610941ddec34b44f54073f0f0acf1ccd1b9ae48
    with:
      python-version: "3.12"
      check-pictures: true
      run-tool-tests: false

  changelog:
    name: The change has a line in the CHANGELOG
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: The change has a line in the CHANGELOG
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -I tools/changelog_pr_check.py --base "origin/$BASE_REF"

  shared-cases:
    name: Case files shared with the Android app and versions of the app project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Case files shared with the Android app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -I tools/test_check_shared_cases.py
          python -I tools/check_shared_cases.py
      - name: Versions of the app project
        run: |
          python -I tools/test_check_ios_build.py
          python -I tools/check_ios_build.py

  tests:
    name: Tests of the Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test
        run: swift test

  app:
    name: Build the app target
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build the app for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project EH3D-IOS-CONTROL.xcodeproj -scheme EH3D -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log | tail -n 20 || { grep -E 'error:' build.log | sort -u | head -n 40; exit 1; }
      - name: The built app shows the version of the project
        run: python3 tools/check_ios_build.py "$(find build/derived/Build/Products -name 'EH3D.app' -type d | head -n 1)"
